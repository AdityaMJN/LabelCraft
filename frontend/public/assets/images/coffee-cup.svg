<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coffee-gradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#92400e" />
      <stop offset="50%" style="stop-color:#a16207" />
      <stop offset="100%" style="stop-color:#78350f" />
    </radialGradient>
    <linearGradient id="cup-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6" />
      <stop offset="100%" style="stop-color:#d1d5db" />
    </linearGradient>
  </defs>
  <!-- Cup body -->
  <ellipse cx="150" cy="160" rx="45" ry="25" fill="url(#cup-gradient)" stroke="#9ca3af" stroke-width="2"/>
  <rect x="120" y="100" width="60" height="60" fill="url(#cup-gradient)" stroke="#9ca3af" stroke-width="2" rx="8"/>
  <!-- Coffee -->
  <ellipse cx="150" cy="155" rx="35" ry="18" fill="url(#coffee-gradient)"/>
  <!-- Steam -->
  <path d="M140,90 Q145,80 150,90 Q155,80 160,90" stroke="#d1d5db" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M145,85 Q150,75 155,85 Q160,75 165,85" stroke="#d1d5db" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Handle -->
  <path d="M180,120 Q195,125 195,140 Q195,150 180,145" fill="none" stroke="#9ca3af" stroke-width="3"/>
</svg>