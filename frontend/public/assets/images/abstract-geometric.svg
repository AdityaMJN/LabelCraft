<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abstract-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="25%" style="stop-color:#764ba2" />
      <stop offset="50%" style="stop-color:#f093fb" />
      <stop offset="75%" style="stop-color:#f5576c" />
      <stop offset="100%" style="stop-color:#4facfe" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="200" fill="url(#abstract-gradient)"/>
  <!-- Geometric shapes -->
  <circle cx="80" cy="80" r="40" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <rect x="160" y="60" width="60" height="60" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="2" rx="8"/>
  <polygon points="220,40 260,80 220,120 180,80" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="2"/>
  <!-- Connecting lines -->
  <line x1="120" y1="80" x2="160" y2="80" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="220" y1="80" x2="180" y2="80" stroke="white" stroke-width="1" opacity="0.6"/>
</svg>