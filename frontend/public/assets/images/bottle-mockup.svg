<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0" />
      <stop offset="50%" style="stop-color:#cbd5e1" />
      <stop offset="100%" style="stop-color:#94a3b8" />
    </linearGradient>
    <radialGradient id="cap-gradient" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#1f2937" />
      <stop offset="100%" style="stop-color:#374151" />
    </radialGradient>
  </defs>
  <!-- Bottle body -->
  <ellipse cx="150" cy="140" rx="35" ry="50" fill="url(#bottle-gradient)" stroke="#64748b" stroke-width="1"/>
  <rect x="135" y="90" width="30" height="50" fill="url(#bottle-gradient)" stroke="#64748b" stroke-width="1" rx="15"/>
  <!-- Bottle neck -->
  <rect x="142" y="70" width="16" height="25" fill="url(#bottle-gradient)" stroke="#64748b" stroke-width="1" rx="8"/>
  <!-- Cap -->
  <rect x="140" y="60" width="20" height="15" fill="url(#cap-gradient)" stroke="#1f2937" stroke-width="1" rx="2"/>
  <!-- Label area (highlighted) -->
  <rect x="125" y="100" width="50" height="30" fill="none" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
  <!-- LabelCraft text -->
  <text x="150" y="118" text-anchor="middle" fill="#667eea" font-family="Arial, sans-serif" font-size="10" font-weight="bold">LabelCraft</text>
</svg>