<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="crust-gradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#d97706" />
      <stop offset="100%" style="stop-color:#92400e" />
    </radialGradient>
    <linearGradient id="cheese-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24" />
      <stop offset="100%" style="stop-color:#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Pizza slice shape -->
  <path d="M150,50 L250,120 L150,180 L50,120 Z" fill="url(#crust-gradient)" stroke="#78350f" stroke-width="2"/>
  <!-- Cheese -->
  <path d="M150,60 L230,115 L150,165 L70,115 Z" fill="url(#cheese-gradient)"/>
  <!-- Pepperoni -->
  <circle cx="120" cy="100" r="8" fill="#dc2626"/>
  <circle cx="180" cy="120" r="6" fill="#dc2626"/>
  <circle cx="150" cy="140" r="7" fill="#dc2626"/>
  <!-- Green peppers -->
  <ellipse cx="160" cy="95" rx="6" ry="4" fill="#16a34a"/>
  <ellipse cx="130" cy="130" rx="5" ry="3" fill="#16a34a"/>
  <!-- Mushrooms -->
  <ellipse cx="140" cy="110" rx="4" ry="6" fill="#a3a3a3"/>
  <ellipse cx="170" cy="135" rx="3" ry="5" fill="#a3a3a3"/>
</svg>